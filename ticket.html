<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Seu ingresso · RESENHA IMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Grotesque:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/ingresso.css" />
<link rel="stylesheet" href="/ticket.css" />
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<header class="t-header">
  <a href="#" id="backToGroup" class="back" aria-label="voltar">←</a>
  <div class="t-title">
    <span class="kicker">RESENHA IMP · 05.06.2026</span>
    <h1>seu ingresso 🎟️</h1>
  </div>
</header>

<div class="t-loader" id="loader">
  <div class="spinner"></div>
  <p>buscando seu ingresso...</p>
</div>

<div class="t-error" id="error" hidden>
  <h2>😬 não rolou</h2>
  <p id="errorMsg">não encontramos esse ingresso.</p>
</div>

<main class="single-ticket" id="single" hidden>
  <div class="big-qr-wrap">
    <div class="big-qr" id="qrBox">
      <img id="qrImg" alt="QR" loading="eager" />
      <div class="qr-refresh-overlay" id="qrRefreshOverlay" hidden>
        <div class="qr-spinner"></div>
      </div>
    </div>
    <div class="big-status" id="status">✓ válido</div>
    <div class="qr-countdown" id="countdown">
      <div class="qr-countdown-bar" id="countdownBar"></div>
      <span class="qr-countdown-text" id="countdownText">🔄 renova em 10s</span>
    </div>
  </div>

  <div class="big-info">
    <h2 id="name">—</h2>
    <span class="gender-pill" id="gender">—</span>
    <div class="ticket-code" id="code">—</div>
  </div>

  <div class="big-where">
    <div class="where-line"><strong>quando</strong> 5 de junho · sex · 20h</div>
    <div class="where-line"><strong>onde</strong> Condomínio Jardim Marapendi</div>
  </div>

  <p class="big-note">💾 salve essa página · mostre o QR na entrada</p>

  <div class="big-actions">
    <button class="btn" id="copyLink">copiar link</button>
    <button class="btn" id="waLink">mandar pro whatsapp</button>
    <a class="btn btn-ghost" id="seeGroup" href="#">ver todos do grupo</a>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/ticket.js"></script>
</body>
</html>
